[package]
name = "slack-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
directories = "6.0.0"
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "multipart", "stream", "form", "http2", "cookies"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
url = "2.5.8"
webpki-root-certs = "1.0.9"
urlencoding = "2.1.3"
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# The tests that build an HTTP client install ring, as ttyak's `main` does.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
