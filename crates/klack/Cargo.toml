[package]
name = "klack"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
slack-core = { version = "0.1.0", path = "../slack-core" }
huddle = { path = "../huddle" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
ratatui-image = { version = "12.0.0-rc.3", default-features = false, features = ["image-defaults", "crossterm"] }
image = "0.25"
futures-util = "0.3.34"
notify-rust = "4.18.2"
unicode-width = "0.2.2"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
emojis = "0.9.1"
chrono = "0.4.45"
directories = "6.0.0"
cpal = "0.18.2"
rustls = { version = "0.23.46", features = ["ring"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
toml = "1.1.8"
chrono-tz = "0.10.4"

[target.'cfg(unix)'.dependencies]
# Reading the terminal's device attributes with a timeout (pictures in sixel terminals).
rustix = { version = "1.1.5", features = ["event", "stdio"] }
