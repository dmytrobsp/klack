[workspace]
resolver = "3"
members = ["crates/slack-core", "crates/huddle", "crates/klack"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dmytrobsp/klack"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[profile.release]
lto = "thin"
strip = true

# OpenH264 is C code built by the crate; unoptimised it cannot encode a camera in real time,
# which makes debug builds useless for video tests.
[profile.dev.package.openh264-sys2]
opt-level = 3
