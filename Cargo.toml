[workspace]
resolver = "3"
members = ["crates/slack-core", "crates/huddle", "crates/ttyak"]

[workspace.package]
version = "0.11.0-rc.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dmytrobsp/ttyak"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[profile.release]
# Whole-program optimisation in one unit: about a fifth smaller than thin LTO (28.6 MB against
# 36.4 MB stripped on Linux, 2026-10-19), at the cost of a slower release build.
lto = "fat"
codegen-units = 1
strip = true

# OpenH264 is C code built by the crate; unoptimised it cannot encode a camera in real time,
# which makes debug builds useless for video tests.
[profile.dev.package.openh264-sys2]
opt-level = 3

# ttyak: rtc-turn 0.21.1 with a fix for TURN "438 Stale Nonce" answers (VX5b) — see
# vendor/rtc-turn/TTYAK-PATCH.md for what changed and when to drop this.
# ttyak: crossterm 0.29.0 that decodes the mouse's side buttons (VY9) — see vendor/crossterm/TTYAK-PATCH.md.
[patch.crates-io]
rtc-turn = { path = "vendor/rtc-turn" }
crossterm = { path = "vendor/crossterm" }
