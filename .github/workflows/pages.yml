# The landing page (site/) on GitHub Pages. Rebuilt when the site changes and after every tag's Release run, so
# the download links, sizes and version always name the latest release, and site/latest.json (the update check's
# feed) is the one in its recipes zip (fill.py --fetch-release). A Release run counts whatever its registry jobs did:
# a failed push to a registry must not hold the feed back. The privacy check (tools/site/check_private.py) needs a
# list that is not in the repo: it runs locally before every commit.
name: Pages

on:
  push:
    branches: [master]
    paths: ["site/**", "tools/site/**", "README.md", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tests
        run: |
          python3 -m unittest discover -s tools/site -p 'test_*.py'
          node --test "tools/site/*.test.mjs"
      - name: Fill in the latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/site/fill.py site --fetch-release --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
