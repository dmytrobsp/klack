# Release builds. A `v*` tag (matching the Cargo version) builds every platform and publishes a GitHub
# Release with the archives and SHA256SUMS; a manual run only builds them (artifacts, no release).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: an older glibc, so the binary runs on more distributions.
          - { name: x86_64-linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, exe: ttyak }
          - { name: aarch64-macos, os: macos-14, target: aarch64-apple-darwin, exe: ttyak }
          - { name: x86_64-macos, os: macos-14, target: x86_64-apple-darwin, exe: ttyak }
          # 22.04's MinGW (gcc 10) lacks what Opus and the static C runtime need; CI builds on 24.04 too.
          - { name: x86_64-windows, os: ubuntu-24.04, target: x86_64-pc-windows-gnu, exe: ttyak.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config cmake libasound2-dev mingw-w64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      # The plain files, not an archive: GitHub zips every artifact itself, so a run's download is one zip with
      # the program and docs at its top. (Artifacts lose the executable bit; the release job puts it back.)
      - name: Stage
        shell: bash
        run: |
          mkdir stage
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" README.md LICENSE-MIT LICENSE-APACHE stage/
          ls -l stage
      - uses: actions/upload-artifact@v4
        with:
          name: ttyak-${{ matrix.name }}
          path: stage/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the Cargo version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "${GITHUB_REF_NAME}" = "v$version" ] || { echo "tag ${GITHUB_REF_NAME} but Cargo version $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: staged
      # One zip per platform with the program and docs at its top (no folder, no archive inside an archive); zip keeps
      # the executable bit for unzip, macOS Finder and Linux file managers.
      - name: Archives
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir dist
          for d in staged/ttyak-*; do
            name=${d#staged/ttyak-}
            [ -f "$d/ttyak" ] && chmod 755 "$d/ttyak"
            (cd "$d" && zip -q -X "../../dist/ttyak-$version-$name.zip" *)
            unzip -l "dist/ttyak-$version-$name.zip"
          done
      - name: Checksums
        run: cd dist && sha256sum ttyak-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "ttyak $GITHUB_REF_NAME" --generate-notes
