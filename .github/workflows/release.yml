# Release builds. A `v*` tag (matching the Cargo version) builds every platform, packages it (one zip per platform,
# .deb and .rpm for both Linux architectures, the package recipes, SHA256SUMS over all of them), attests every file and
# publishes a GitHub Release (a pre-release when the version has a `-`). A manual run does all of it but the release,
# as version 0.0.0-dispatch.<run number>, and keeps the would-be release files as the run's `dist` artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: an older glibc, so the binary runs on more distributions (arm64 too: GitHub's arm runner).
          - { name: x86_64-linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, exe: ttyak }
          - { name: aarch64-linux, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, exe: ttyak }
          - { name: aarch64-macos, os: macos-14, target: aarch64-apple-darwin, exe: ttyak }
          - { name: x86_64-macos, os: macos-14, target: x86_64-apple-darwin, exe: ttyak }
          # 22.04's MinGW (gcc 10) lacks what Opus and the static C runtime need; CI builds on 24.04 too.
          - { name: x86_64-windows, os: ubuntu-24.04, target: x86_64-pc-windows-gnu, exe: ttyak.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Packages (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config cmake libasound2-dev
          ${{ matrix.name == 'x86_64-windows' && 'mingw-w64' || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      # The plain files, not an archive: GitHub zips every artifact itself, so a run's download is one zip with
      # the program and docs at its top. (Artifacts lose the executable bit; the release job puts it back.)
      - name: Stage
        shell: bash
        run: |
          mkdir stage
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" README.md LICENSE-MIT LICENSE-APACHE stage/
          ls -l stage
      - uses: actions/upload-artifact@v4
        with:
          name: ttyak-${{ matrix.name }}
          path: stage/*

  # Packages and attests on every run; publishes only for a pushed tag.
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release
      id-token: write # the attestations' Sigstore certificate
      attestations: write # storing the attestations
    defaults:
      run:
        shell: bash
    env:
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      NFPM_VERSION: 2.48.0
      # nfpm_2.48.0_Linux_x86_64.tar.gz in https://github.com/goreleaser/nfpm/releases/download/v2.48.0/checksums.txt
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
    steps:
      - uses: actions/checkout@v4
      # A tag must match the Cargo version; a manual run gets a version that is semver and plainly no release.
      - name: Version
        run: |
          if [ "$PUBLISH" = true ]; then
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            [ "${GITHUB_REF_NAME}" = "v$version" ] || { echo "tag ${GITHUB_REF_NAME} but Cargo version $version"; exit 1; }
          else
            version=0.0.0-dispatch.$GITHUB_RUN_NUMBER
          fi
          echo "V=$version" >> "$GITHUB_ENV"
          echo "DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "version $version"
      - uses: actions/download-artifact@v4
        with:
          pattern: ttyak-*
          path: staged
      # One zip per platform with the program and docs at its top (no folder, no archive inside an archive); zip keeps
      # the executable bit for unzip, macOS Finder and Linux file managers.
      - name: Archives
        run: |
          mkdir dist
          for name in x86_64-linux aarch64-linux x86_64-macos aarch64-macos x86_64-windows; do
            d=staged/ttyak-$name
            [ -d "$d" ] || { echo "no build for $name"; exit 1; }
            if [ -f "$d/ttyak" ]; then chmod 755 "$d/ttyak"; fi
            (cd "$d" && zip -q -X "../../dist/ttyak-$V-$name.zip" ./*)
            unzip -l "dist/ttyak-$V-$name.zip"
          done
      - name: nfpm
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          "$RUNNER_TEMP/nfpm" --version
      # .deb and .rpm from the Linux zips' own files, by the nfpm.yaml render.py makes (here from the zips' sums; the
      # recipes below render the same file from the full SHA256SUMS). File names as the docs give them, the version
      # as it is: nfpm's own names write a pre-release with `~`, and GitHub renames special characters in asset names.
      - name: Packages
        run: |
          mkdir build
          (cd dist && sha256sum ttyak-*.zip) > build/zips.sums
          python3 packaging/render.py --version "$V" --date "$DATE" --sums build/zips.sums --out build/pre
          for p in x86_64-linux:amd64:x86_64 aarch64-linux:arm64:aarch64; do
            IFS=: read -r name deb rpm <<< "$p"
            unzip -q "dist/ttyak-$V-$name.zip" -d "build/$name"
            (cd build && TTYAK_ARCH=$deb TTYAK_DIR=$name "$RUNNER_TEMP/nfpm" package --config pre/nfpm.yaml \
              --packager deb --target "../dist/ttyak_${V}_$deb.deb")
            (cd build && TTYAK_ARCH=$deb TTYAK_DIR=$name "$RUNNER_TEMP/nfpm" package --config pre/nfpm.yaml \
              --packager rpm --target "../dist/ttyak-$V-1.$rpm.rpm")
          done
          ls -l dist
      # SHA256SUMS over every file; the recipes are rendered from it, zipped, and the zip's line goes in last (render.py
      # skips that line, so the recipes never need their own hash).
      - name: Checksums and recipes
        run: |
          (cd dist && sha256sum ttyak-* ttyak_* > SHA256SUMS)
          python3 packaging/render.py --version "$V" --date "$DATE" --sums dist/SHA256SUMS --out build/recipes
          cmp build/pre/nfpm.yaml build/recipes/nfpm.yaml
          (cd build/recipes && zip -q -r -X "../../dist/ttyak-$V-recipes.zip" .)
          (cd dist && sha256sum "ttyak-$V-recipes.zip" >> SHA256SUMS && sha256sum -c SHA256SUMS)
          unzip -l "dist/ttyak-$V-recipes.zip"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          case $V in *-*) pre=(--prerelease --latest=false) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "ttyak $GITHUB_REF_NAME" --generate-notes "${pre[@]}"
