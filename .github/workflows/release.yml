# Release builds. A `v*` tag (matching the Cargo version) builds every platform, packages it (one zip per platform,
# .deb and .rpm for both Linux architectures, the package recipes, SHA256SUMS over all of them), attests every file,
# keeps them as the run's `dist` artifact and publishes a GitHub Release (a pre-release when the version has a `-`).
# After the release, never holding it up, a tag of dmytrobsp/ttyak without `-` goes to the Homebrew tap, the Scoop
# bucket, the AUR, Chocolatey and winget (a pre-release only to the tap's and the bucket's `rc` branch); each skips
# with a notice when its secret is missing. A manual run publishes nothing, to GitHub or anywhere else: it builds as
# version 0.0.0-dispatch.<run number> and keeps `dist` 7 days. A tag of dmytrobsp/ttyak signs and notarizes the macOS
# builds, a manual run only when asked (`sign`); a fork's builds are unsigned (its tag publishes an unsigned release in
# the fork).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize the macOS builds
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: an older glibc, so the binary runs on more distributions (arm64 too: GitHub's arm runner).
          - { name: x86_64-linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, exe: ttyak, apt: pkg-config cmake libasound2-dev }
          - { name: aarch64-linux, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, exe: ttyak, apt: pkg-config cmake libasound2-dev }
          - { name: aarch64-macos, os: macos-14, target: aarch64-apple-darwin, exe: ttyak }
          - { name: x86_64-macos, os: macos-14, target: x86_64-apple-darwin, exe: ttyak }
          # 22.04's MinGW (gcc 10) lacks what Opus and the static C runtime need; CI builds on 24.04 too. Only the
          # x86_64 MinGW toolchain (the `mingw-w64` metapackage adds i686's, ~290 MB in all), the list CI's
          # windows-cross installs, so this build finds the .debs CI caches on master.
          - { name: x86_64-windows, os: ubuntu-24.04, target: x86_64-pc-windows-gnu, exe: ttyak.exe, apt: cmake gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 }
    runs-on: ${{ matrix.os }}
    # (macOS: notarization is waited for up to 10 minutes. Linux: apt up to 22.)
    timeout-minutes: ${{ startsWith(matrix.os, 'macos') && 45 || 35 }}
    env:
      APT_PACKAGES: ${{ matrix.apt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Windows: the .debs (158 MB) cached as in CI's windows-cross (same key, same path). Saved from a branch's run
      # only: a tag's cache would serve that tag alone.
      - name: Packages cache key (Windows)
        id: apt-key
        if: matrix.name == 'x86_64-windows'
        run: |
          prefix="apt-$ImageOS-$RUNNER_ARCH-$(printf '%s' "$APT_PACKAGES" | sha256sum | cut -c1-16)-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "key: $prefix$ImageVersion"
      - uses: actions/cache/restore@v6
        id: apt-cache
        if: matrix.name == 'x86_64-windows'
        with:
          path: /tmp/ttyak-apt/*.deb
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: ${{ steps.apt-key.outputs.prefix }}
      # Bounded and verbose, another mirror when the default one is slow (tools/ci/apt-install.sh; under 23.5 min).
      - name: Packages (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 24
        run: |
          read -ra packages <<< "$APT_PACKAGES"
          bash tools/ci/apt-install.sh /tmp/ttyak-apt "${packages[@]}"
      - uses: actions/cache/save@v6
        if: matrix.name == 'x86_64-windows' && steps.apt-cache.outputs.cache-hit != 'true' && github.ref_type == 'branch'
        with:
          path: /tmp/ttyak-apt/*.deb
          key: ${{ steps.apt-key.outputs.key }}
      # Pinned by commit: they run before the macOS signing steps, which hold the Apple secrets. (CI keeps the tags.)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      # macOS: the binary signed with the user's Developer ID (hardened runtime, Apple's timestamp) and notarized,
      # before it is staged, so the zips, SHA256SUMS and attestations are of the signed one. A tag of dmytrobsp/ttyak
      # signs, a manual run only with `sign` true; either fails without the secrets (a release of dmytrobsp/ttyak is
      # never published unsigned). A manual run without `sign`, or a fork's tag, builds unsigned with a notice.
      - name: Signing (macOS)
        id: signing
        if: runner.os == 'macOS'
        env:
          HAVE: >-
            ${{ secrets.APPLE_P12 != '' && secrets.APPLE_P12_PASSWORD != '' && secrets.APPLE_API_KEY != ''
            && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_TEAM_ID != '' }}
          TAG: >-
            ${{ github.repository == 'dmytrobsp/ttyak' && github.event_name == 'push'
            && startsWith(github.ref, 'refs/tags/v') }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          ASKED: ${{ github.event_name == 'workflow_dispatch' && inputs.sign }}
        run: |
          if [ "$TAG" = true ] || [ "$ASKED" = true ]; then
            if [ "$HAVE" != true ]; then
              if [ "$TAG" = true ]; then
                echo "::error::the Apple signing secrets are missing: a release of dmytrobsp/ttyak is never published unsigned"
              else
                echo "::error::the Apple signing secrets are missing, and sign=true asked for signing"
              fi
              exit 1
            fi
            echo "sign=true" >> "$GITHUB_OUTPUT"
          elif [ "$MANUAL" = true ]; then
            echo "::notice::unsigned: manual run without sign=true"
          else
            echo "::notice::unsigned: not a tag of dmytrobsp/ttyak"
          fi
      # A keychain of its own for the run (a random password, removed below); codesign picks the Developer ID
      # Application identity of the team by its SHA-1, and is let use the key without a prompt.
      - name: Sign (macOS)
        if: steps.signing.outputs.sign == 'true'
        env:
          APPLE_P12: ${{ secrets.APPLE_P12 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXE: target/${{ matrix.target }}/release/${{ matrix.exe }}
        run: |
          set +x
          umask 077
          kc="$RUNNER_TEMP/ttyak-signing.keychain-db"
          p12="$RUNNER_TEMP/ttyak-signing.p12"
          pass=$(openssl rand -hex 32)
          printf '%s' "$APPLE_P12" | base64 --decode > "$p12"
          security create-keychain -p "$pass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pass" "$kc"
          security import "$p12" -k "$kc" -f pkcs12 -P "$APPLE_P12_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$kc" > /dev/null
          others=()
          while IFS= read -r k; do others+=("$k"); done < <(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//')
          security list-keychains -d user -s "$kc" "${others[@]}"
          # (Only the hash is taken: the identity's name is the user's.)
          id=$(security find-identity -v -p codesigning "$kc" |
            awk -v team="($APPLE_TEAM_ID)\"" 'index($0, "\"Developer ID Application: ") && index($0, team) { print $2; exit }')
          [ -n "$id" ] || { echo "::error::the certificate has no Developer ID Application identity of the team"; exit 1; }
          codesign --force --options runtime --timestamp --identifier ttyak \
            --entitlements packaging/macos/ttyak.entitlements --keychain "$kc" --sign "$id" "$EXE"
          codesign --verify --strict --verbose=2 "$EXE"
          # (The same requirement as Codesign::holds in crates/ttyak/src/update.rs.)
          codesign --verify --strict --test-requirement "=anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\"" "$EXE"
          codesign -d --verbose=2 "$EXE" 2>&1 | grep -E '^(Identifier=|Format=|CodeDirectory |Timestamp=|TeamIdentifier=|Runtime Version=)'
      # Apple's notary service checks a zip of the binary; a bare binary cannot be stapled, so Gatekeeper looks the
      # ticket up online at the first start. Rejected fails the job; still in progress after NOTARY_WAIT_MIN minutes
      # only warns (the team's first submissions took 30 to 70 minutes): Apple serves the ticket once it is done.
      - name: Notarize (macOS)
        if: steps.signing.outputs.sign == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          EXE: target/${{ matrix.target }}/release/${{ matrix.exe }}
          NOTARY_WAIT_MIN: 10
        run: |
          set +x
          umask 077
          key="$RUNNER_TEMP/ttyak-notary.p8"
          zip="$RUNNER_TEMP/ttyak-notarize.zip"
          printf '%s\n' "$APPLE_API_KEY" > "$key"
          ditto -c -k --keepParent "$EXE" "$zip"
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          field() { python3 -c 'import json, sys; print(json.load(sys.stdin)[sys.argv[1]])' "$1" 2> /dev/null; }
          id=$(xcrun notarytool submit "$zip" "${auth[@]}" --output-format json | field id)
          echo "notarytool: submitted $id"
          # (A read that fails keeps the last status read; none read at all is "unknown".)
          deadline=$((SECONDS + ${NOTARY_WAIT_MIN:-10} * 60))
          status=unknown
          while :; do
            if got=$(xcrun notarytool info "$id" "${auth[@]}" --output-format json | field status); then
              status=$got
            fi
            case $status in "In Progress" | unknown) ;; *) break ;; esac
            [ "$SECONDS" -lt "$deadline" ] || break
            sleep 30
          done
          echo "notarytool: $id $status"
          case $status in
            Accepted) ;;
            "In Progress")
              echo "::warning::notarization $id still in progress; Apple serves the ticket online when it finishes (a bare binary can't be stapled)" ;;
            unknown)
              echo "::warning::could not read the status of $id; Apple serves the ticket online once it is accepted" ;;
            *)
              xcrun notarytool log "$id" "${auth[@]}" || true
              echo "::error::notarization $id: $status"
              exit 1 ;;
          esac
      - name: Remove the signing files (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/ttyak-signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/ttyak-signing.p12" "$RUNNER_TEMP/ttyak-notary.p8" "$RUNNER_TEMP/ttyak-notarize.zip"
      # The plain files, not an archive: GitHub zips every artifact itself, so a run's download is one zip with
      # the program and docs at its top. (Artifacts lose the executable bit; the release job puts it back.)
      - name: Stage
        shell: bash
        run: |
          mkdir stage
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" README.md LICENSE-MIT LICENSE-APACHE stage/
          ls -l stage
      - uses: actions/upload-artifact@v7
        with:
          name: ttyak-${{ matrix.name }}
          path: stage/*

  # Packages and attests on every run; the job `publish` makes the release from its `dist`.
  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # the attestations' Sigstore certificate
      attestations: write # storing the attestations
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      NFPM_VERSION: 2.48.0
      # nfpm_2.48.0_Linux_x86_64.tar.gz in https://github.com/goreleaser/nfpm/releases/download/v2.48.0/checksums.txt
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A tag must match the Cargo version; a manual run gets a version that is semver and plainly no release.
      - name: Version
        id: version
        run: |
          if [ "$PUBLISH" = true ]; then
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            [ "${GITHUB_REF_NAME}" = "v$version" ] || { echo "tag ${GITHUB_REF_NAME} but Cargo version $version"; exit 1; }
          else
            version=0.0.0-dispatch.$GITHUB_RUN_NUMBER
          fi
          echo "V=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "version $version"
      - uses: actions/download-artifact@v8
        with:
          pattern: ttyak-*
          path: staged
      # One zip per platform with the program and docs at its top (no folder, no archive inside an archive); zip keeps
      # the executable bit for unzip, macOS Finder and Linux file managers.
      - name: Archives
        run: |
          mkdir dist
          for name in x86_64-linux aarch64-linux x86_64-macos aarch64-macos x86_64-windows; do
            d=staged/ttyak-$name
            [ -d "$d" ] || { echo "no build for $name"; exit 1; }
            if [ -f "$d/ttyak" ]; then chmod 755 "$d/ttyak"; fi
            (cd "$d" && zip -q -X "../../dist/ttyak-$V-$name.zip" ./*)
            unzip -l "dist/ttyak-$V-$name.zip"
          done
      - name: nfpm
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          "$RUNNER_TEMP/nfpm" --version
      # .deb and .rpm from the Linux zips' own files, by the nfpm.yaml render.py makes (here from the zips' sums; the
      # recipes below render the same file from the full SHA256SUMS). File names as the docs give them, the version
      # as it is: nfpm's own names write a pre-release with `~`, and GitHub renames special characters in asset names.
      - name: Packages
        run: |
          mkdir build
          (cd dist && sha256sum ttyak-*.zip) > build/zips.sums
          python3 packaging/render.py --version "$V" --date "$DATE" --sums build/zips.sums --out build/pre
          for p in x86_64-linux:amd64:x86_64 aarch64-linux:arm64:aarch64; do
            IFS=: read -r name deb rpm <<< "$p"
            unzip -q "dist/ttyak-$V-$name.zip" -d "build/$name"
            (cd build && TTYAK_ARCH=$deb TTYAK_DIR=$name "$RUNNER_TEMP/nfpm" package --config pre/nfpm.yaml \
              --packager deb --target "../dist/ttyak_${V}_$deb.deb")
            (cd build && TTYAK_ARCH=$deb TTYAK_DIR=$name "$RUNNER_TEMP/nfpm" package --config pre/nfpm.yaml \
              --packager rpm --target "../dist/ttyak-$V-1.$rpm.rpm")
          done
          ls -l dist
      # SHA256SUMS over every file; the recipes are rendered from it, zipped, and the zip's line goes in last (render.py
      # skips that line, so the recipes never need their own hash).
      - name: Checksums and recipes
        run: |
          (cd dist && sha256sum ttyak-* ttyak_* > SHA256SUMS)
          python3 packaging/render.py --version "$V" --date "$DATE" --sums dist/SHA256SUMS --out build/recipes
          cmp build/pre/nfpm.yaml build/recipes/nfpm.yaml
          (cd build/recipes && zip -q -r -X "../../dist/ttyak-$V-recipes.zip" .)
          (cd dist && sha256sum "ttyak-$V-recipes.zip" >> SHA256SUMS && sha256sum -c SHA256SUMS)
          unzip -l "dist/ttyak-$V-recipes.zip"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          # (A tag run's: the repository's default.)
          retention-days: ${{ env.PUBLISH != 'true' && '7' || '' }}

  # The GitHub Release, for a pushed `v*` tag only (a manual run never publishes, Ruling JJ): every file of `dist`,
  # a pre-release (never latest) when the version has a `-`. Nothing after it can hold it up.
  publish:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release
    defaults:
      run:
        shell: bash
    env:
      V: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          pre=()
          case $V in *-*) pre=(--prerelease --latest=false) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "ttyak $GITHUB_REF_NAME" --generate-notes "${pre[@]}"

  # Which registries the run goes to, with a notice for each one it skips: only from a tag of dmytrobsp/ttyak whose
  # GitHub Release was published; a version with `-` only to the tap's and the bucket's `rc` branch (Task 22's
  # rehearsal); each only with its secret. winget runs komac's dry run whenever it does not submit.
  registries:
    needs: [release, publish]
    if: ${{ !cancelled() && needs.release.result == 'success' && github.repository == 'dmytrobsp/ttyak' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ needs.release.outputs.version }}
      git: ${{ steps.plan.outputs.git }} # default | rc: the tap's and the bucket's branch
      aur: ${{ steps.plan.outputs.aur }} # go
      chocolatey: ${{ steps.plan.outputs.chocolatey }} # go
      winget: ${{ steps.plan.outputs.winget }} # submit | dry-run
    steps:
      - name: Plan
        id: plan
        env:
          TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          RELEASED: ${{ needs.publish.result == 'success' }}
          V: ${{ needs.release.outputs.version }}
          HAVE_PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN != '' }}
          HAVE_AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY != '' }}
          HAVE_CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY != '' }}
          HAVE_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
        run: |
          skip() { echo "::notice title=$1 skipped::$2"; }
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1: $2"; }
          dry() { echo "::notice title=winget dry run::$1: komac only reads the manifests"; out winget dry-run; }
          if [ "$TAG" != true ]; then
            for r in tap bucket aur chocolatey; do skip "$r" "a manual run publishes nothing"; done
            dry "a manual run publishes nothing"
            exit 0
          fi
          if [ "$RELEASED" != true ]; then
            for r in tap bucket aur chocolatey winget; do skip "$r" "the GitHub Release of v$V was not published"; done
            exit 0
          fi
          pre=false
          case $V in *-*) pre=true ;; esac
          if [ "$HAVE_PUBLISH_TOKEN" != true ]; then
            for r in tap bucket; do skip "$r" "no secret PUBLISH_TOKEN"; done
          elif [ "$pre" = true ]; then
            out git rc
          else
            out git default
          fi
          for r in aur:AUR_SSH_KEY:$HAVE_AUR_SSH_KEY chocolatey:CHOCOLATEY_API_KEY:$HAVE_CHOCOLATEY_API_KEY; do
            IFS=: read -r name secret have <<< "$r"
            if [ "$pre" = true ]; then
              skip "$name" "v$V is a pre-release: only the tap's and the bucket's rc branch get it"
            elif [ "$have" != true ]; then
              skip "$name" "no secret $secret"
            else
              out "$name" go
            fi
          done
          if [ "$pre" = true ]; then
            dry "v$V is a pre-release"
          elif [ "$HAVE_WINGET_TOKEN" != true ]; then
            dry "no secret WINGET_TOKEN"
          else
            out winget submit
          fi

  # The Homebrew tap and the Scoop bucket: the rendered file committed as "ttyak V" on the repository's default
  # branch (a pre-release: on `rc`, made from the default branch the first time), with PUBLISH_TOKEN.
  tap-bucket:
    name: ${{ matrix.registry }}
    needs: [publish, registries]
    if: github.repository == 'dmytrobsp/ttyak' && needs.registries.outputs.git != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { registry: tap, repo: dmytrobsp/homebrew-ttyak, from: homebrew/ttyak.rb, to: Formula/ttyak.rb }
          - { registry: bucket, repo: dmytrobsp/scoop-ttyak, from: scoop/ttyak.json, to: bucket/ttyak.json }
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # (None of these jobs uses GITHUB_TOKEN: download-artifact takes the run's own artifacts with the runner's token.)
    permissions: {}
    defaults:
      run:
        shell: bash
    env:
      V: ${{ needs.registries.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Recipes
        run: |
          (cd dist && awk -v f="ttyak-$V-recipes.zip" '$2 == f' SHA256SUMS | sha256sum -c -)
          unzip -q "dist/ttyak-$V-recipes.zip" -d recipes
      - name: Push
        env:
          TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          BRANCH: ${{ needs.registries.outputs.git }}
          NAME: ${{ matrix.registry }}
          REPO: ${{ matrix.repo }}
          FROM: ${{ matrix.from }}
          TO: ${{ matrix.to }}
          GIT_TERMINAL_PROMPT: 0
        run: |
          set +x
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git=(git -c credential.helper= -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth")
          url="https://github.com/$REPO.git"
          if [ "$BRANCH" = rc ] && [ -n "$("${git[@]}" ls-remote --heads "$url" rc)" ]; then
            "${git[@]}" clone -q --depth 1 --branch rc "$url" repo
          else
            "${git[@]}" clone -q --depth 1 "$url" repo
            if [ "$BRANCH" = rc ]; then git -C repo checkout -q -b rc; fi
          fi
          branch=$(git -C repo symbolic-ref --short HEAD)
          mkdir -p "repo/$(dirname "$TO")"
          cp "recipes/$FROM" "repo/$TO"
          git -C repo add -- "$TO"
          if git -C repo diff --cached --quiet; then
            echo "::notice title=$NAME::$REPO already has ttyak $V on $branch"
            exit 0
          fi
          git -C repo -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "ttyak $V"
          "${git[@]}" -C repo push -q origin "HEAD:refs/heads/$branch"
          echo "$REPO: ttyak $V on $branch, $(git -C repo rev-parse --short HEAD)"

  # The AUR package ttyak-bin: PKGBUILD and .SRCINFO committed as "ttyak V" and pushed over SSH with AUR_SSH_KEY
  # (made by tools/publish/aur-key.sh); the first push creates the package.
  aur:
    needs: [publish, registries]
    if: github.repository == 'dmytrobsp/ttyak' && needs.registries.outputs.aur == 'go'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    defaults:
      run:
        shell: bash
    env:
      V: ${{ needs.registries.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Recipes
        run: |
          (cd dist && awk -v f="ttyak-$V-recipes.zip" '$2 == f' SHA256SUMS | sha256sum -c -)
          unzip -q "dist/ttyak-$V-recipes.zip" -d recipes
      - name: Push
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          # aur.archlinux.org's ed25519 host key, SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4 as
          # https://aur.archlinux.org/ lists it (ssh-keyscan gave the same key on 2026-10-23).
          AUR_HOST_KEY: aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
        run: |
          set +x
          umask 077
          key="$RUNNER_TEMP/aur.key"
          hosts="$RUNNER_TEMP/aur.known_hosts"
          printf '%s\n' "$AUR_SSH_KEY" | tr -d '\r' | sed '/^$/d' > "$key"
          ssh-keygen -y -P '' -f "$key" > "$key.pub" 2> /dev/null \
            || { echo "::error::AUR_SSH_KEY is not an OpenSSH private key without a passphrase"; exit 1; }
          echo "key: $(ssh-keygen -l -f "$key.pub")"
          printf '%s\n' "$AUR_HOST_KEY" > "$hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o IdentityAgent=none -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts"
          git -c init.defaultBranch=master clone -q ssh://aur@aur.archlinux.org/ttyak-bin.git aur
          cp recipes/aur/PKGBUILD recipes/aur/.SRCINFO aur/
          git -C aur add -- PKGBUILD .SRCINFO
          if git -C aur diff --cached --quiet; then
            echo "::notice title=aur::ttyak-bin already has ttyak $V"
            exit 0
          fi
          git -C aur -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "ttyak $V"
          git -C aur push -q origin HEAD:master
          echo "ttyak-bin: ttyak $V, $(git -C aur rev-parse --short HEAD)"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/aur.key" "$RUNNER_TEMP/aur.key.pub" "$RUNNER_TEMP/aur.known_hosts"

  # Chocolatey: the package packed from the rendered nuspec and pushed with CHOCOLATEY_API_KEY; it is public once
  # Chocolatey's review passes.
  chocolatey:
    needs: [publish, registries]
    if: github.repository == 'dmytrobsp/ttyak' && needs.registries.outputs.chocolatey == 'go'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions: {}
    defaults:
      run:
        shell: pwsh
    env:
      V: ${{ needs.registries.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Recipes
        run: |
          $zip = "ttyak-$env:V-recipes.zip"
          $want = @(Get-Content dist/SHA256SUMS | ForEach-Object { $f = -split $_; if ($f.Count -eq 2 -and $f[1] -eq $zip) { $f[0] } })
          if ($want.Count -ne 1) { throw "SHA256SUMS has no single line for $zip" }
          if ((Get-FileHash "dist/$zip" -Algorithm SHA256).Hash -ne $want[0]) { throw "$zip does not match SHA256SUMS" }
          Expand-Archive "dist/$zip" -DestinationPath recipes
      - name: Pack and push
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          choco pack recipes/chocolatey/ttyak.nuspec --outputdirectory out --limit-output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $nupkg = @(Get-ChildItem out -Filter *.nupkg)
          if ($nupkg.Count -ne 1) { throw "choco pack made $($nupkg.Count) packages" }
          choco push $nupkg[0].FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY --limit-output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  # winget: komac (its release's SHA-256 pinned) opens the pull request to microsoft/winget-pkgs from the user's fork
  # with WINGET_TOKEN (a classic token with public_repo; the fork must exist; a first version goes in as a new
  # package). When it does not submit (a manual run, a pre-release, no secret) it runs komac's dry run with the run's
  # own token: the rendered manifests are read as komac would submit them, and nothing is sent.
  winget:
    needs: [publish, registries]
    if: ${{ !cancelled() && github.repository == 'dmytrobsp/ttyak' && needs.registries.outputs.winget != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # (The dry run's token needs no permission: komac only checks that api.github.com does not answer 401. The pull
    # request check and the submission use WINGET_TOKEN.)
    permissions: {}
    defaults:
      run:
        shell: bash
    env:
      V: ${{ needs.registries.outputs.version }}
      WINGET_ID: dmytrobsp.ttyak
      KOMAC_VERSION: 2.17.1
      # komac-2.17.1-x86_64-unknown-linux-gnu.tar.gz in https://github.com/russellbanks/Komac/releases/download/v2.17.1/SHA256SUMS
      KOMAC_SHA256: e694e79cd451afabf47bead66ed34586fef4814f7b94e4b61a098f419978d5d7
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Recipes
        run: |
          (cd dist && awk -v f="ttyak-$V-recipes.zip" '$2 == f' SHA256SUMS | sha256sum -c -)
          unzip -q "dist/ttyak-$V-recipes.zip" -d recipes
      - name: komac
        run: |
          curl -fsSL -o "$RUNNER_TEMP/komac.tar.gz" \
            "https://github.com/russellbanks/Komac/releases/download/v$KOMAC_VERSION/komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$KOMAC_SHA256  $RUNNER_TEMP/komac.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/komac.tar.gz" -C "$RUNNER_TEMP" komac
          "$RUNNER_TEMP/komac" --version
      # (komac skips manifests it cannot read and then says it found no valid packages, with exit 0.)
      - name: Submit
        env:
          MODE: ${{ needs.registries.outputs.winget }}
          GITHUB_TOKEN: ${{ needs.registries.outputs.winget == 'submit' && secrets.WINGET_TOKEN || github.token }}
        run: |
          set +x
          # komac titles its pull request "New package: <id> version <V>" or "New version: <id> version <V>", from
          # the token's account; one already open for V: nothing is sent again. A check that fails fails the job.
          if [ "$MODE" = submit ]; then
            owner=$(gh api user --jq .login)
            open=$(gh pr list -R microsoft/winget-pkgs --state open --author "$owner" \
              --search "$WINGET_ID version $V in:title" --json title,url \
              --jq ".[] | select(.title | endswith(\"$WINGET_ID version $V\")) | .url")
            if [ -n "$open" ]; then
              echo "::notice title=winget skipped::a pull request for $WINGET_ID $V is open already: ${open%%$'\n'*}"
              exit 0
            fi
          fi
          args=(submit recipes/winget/manifests --yes)
          if [ "$MODE" != submit ]; then args+=(--dry-run); fi
          out=$("$RUNNER_TEMP/komac" "${args[@]}" 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          if grep -q 'No valid packages' <<< "$out"; then
            echo "::error::komac read no complete package from the rendered manifests"
            exit 1
          fi
          echo "komac: $MODE of ttyak $V done"
