# Build and test on Linux and macOS; cross-build the Windows .exe from Linux with MinGW, the way
# CONTRIBUTING.md describes (its tests cannot run there).
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: No old name
        # Every tracked file (old names only on lines marked old-name-ok).
        run: sh tools/check-name.sh .
      - name: Tool tests
        run: python3 -m unittest tools/test_check_name.py tools/test_move_to_ttyak.py tools/install/test_install_sh.py tools/signing/test_apple_csr.py tools/publish/test_aur_key.py
      - name: Packaging tests
        # A run of their own: next to the others, the folder packaging/ would be imported as the PyPI library
        # of that name.
        run: python3 -m unittest discover -s packaging -p 'test_*.py'
      # Bounded and verbose: an apt-get that hangs (it once sat silent for 84 minutes) fails here and shows where.
      - name: Packages
        timeout-minutes: 10
        run: |
          apt=(sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30
            -o DPkg::Lock::Timeout=120)
          "${apt[@]}" update -qq
          "${apt[@]}" install -y --no-install-recommends pkg-config cmake libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked

  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked

  windows-cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Only the x86_64 MinGW toolchain (the `mingw-w64` metapackage adds i686's, ~290 MB in all). The release's
      # x86_64-windows build installs the same list, so its runs find the cache this job saves on master.
      APT_PACKAGES: cmake gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The .debs (158 MB) cached per runner image, architecture and package list: GitHub's default mirror has
      # crawled at 20 MB in 4 minutes. An older image's cache is restored too; apt fetches what it lacks.
      - name: Packages cache key
        id: apt-key
        run: |
          prefix="apt-$ImageOS-$RUNNER_ARCH-$(printf '%s' "$APT_PACKAGES" | sha256sum | cut -c1-16)-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "key: $prefix$ImageVersion"
      - uses: actions/cache/restore@v6
        id: apt-cache
        with:
          path: /tmp/ttyak-apt/*.deb
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: ${{ steps.apt-key.outputs.prefix }}
      # (The script's worst case is 22 minutes.)
      - name: Packages
        timeout-minutes: 23
        run: |
          read -ra packages <<< "$APT_PACKAGES"
          bash tools/ci/apt-install.sh /tmp/ttyak-apt "${packages[@]}"
      # Only after an install that worked; an exact hit is kept as it is.
      - uses: actions/cache/save@v6
        if: steps.apt-cache.outputs.cache-hit != 'true'
        with:
          path: /tmp/ttyak-apt/*.deb
          key: ${{ steps.apt-key.outputs.key }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target x86_64-pc-windows-gnu
      - name: No MinGW DLLs needed
        run: |
          imports=$(x86_64-w64-mingw32-objdump -p target/x86_64-pc-windows-gnu/release/ttyak.exe | grep 'DLL Name' || true)
          echo "$imports"
          ! echo "$imports" | grep -Ei 'libstdc|libgcc|libwinpthread'
