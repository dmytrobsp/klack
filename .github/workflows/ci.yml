# Build and test on Linux and macOS; cross-build the Windows .exe from Linux with MinGW, the way
# CONTRIBUTING.md describes (its tests cannot run there).
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: No old name
        # Every tracked file (old names only on lines marked old-name-ok).
        run: sh tools/check-name.sh .
      - name: Tool tests
        run: python3 -m unittest tools/test_check_name.py tools/test_move_to_ttyak.py tools/install/test_install_sh.py tools/signing/test_apple_csr.py
      - name: Packaging tests
        # A run of their own: next to the others, the folder packaging/ would be imported as the PyPI library
        # of that name.
        run: python3 -m unittest discover -s packaging -p 'test_*.py'
      # Bounded and verbose: an apt-get that hangs (it once sat silent for 84 minutes) fails here and shows where.
      - name: Packages
        timeout-minutes: 10
        run: |
          apt=(sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30
            -o DPkg::Lock::Timeout=120)
          "${apt[@]}" update -qq
          "${apt[@]}" install -y --no-install-recommends pkg-config cmake libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked

  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked

  windows-cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        timeout-minutes: 10
        run: |
          apt=(sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30
            -o DPkg::Lock::Timeout=120)
          "${apt[@]}" update -qq
          "${apt[@]}" install -y --no-install-recommends cmake mingw-w64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target x86_64-pc-windows-gnu
      - name: No MinGW DLLs needed
        run: |
          imports=$(x86_64-w64-mingw32-objdump -p target/x86_64-pc-windows-gnu/release/ttyak.exe | grep 'DLL Name' || true)
          echo "$imports"
          ! echo "$imports" | grep -Ei 'libstdc|libgcc|libwinpthread'
