# Build and test on Linux and macOS; cross-build the Windows .exe from Linux with MinGW, the way
# CONTRIBUTING.md describes (its tests cannot run there).
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No old name
        # Every tracked file (old names only on lines marked old-name-ok).
        run: sh tools/check-name.sh .
      - name: Tool tests
        run: python3 -m unittest tools/test_check_name.py tools/test_move_to_ttyak.py tools/install/test_install_sh.py tools/signing/test_apple_csr.py packaging/test_render.py
      - name: Packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config cmake libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked

  windows-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake mingw-w64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target x86_64-pc-windows-gnu
      - name: No MinGW DLLs needed
        run: |
          imports=$(x86_64-w64-mingw32-objdump -p target/x86_64-pc-windows-gnu/release/ttyak.exe | grep 'DLL Name' || true)
          echo "$imports"
          ! echo "$imports" | grep -Ei 'libstdc|libgcc|libwinpthread'
